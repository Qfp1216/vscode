    <!-- DOM2事件 -->
     <!-- 优点：事件不会被覆盖 -->
      <!-- 缺点：写起来麻烦 -->
     <button id="btn2">按钮2</button>

     <script>

        var btn2 = document.getElementById("btn2");

        // 不被覆盖
        btn2.addEventListener("click",function(){
            alert("点击了按钮1");
        })
                btn2.addEventListener("click",function(){
            alert("点击了按钮2");
        })

     </script>
