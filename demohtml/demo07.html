<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo07</title>
    <link rel="stylesheet" href="../css/demo07.css">
</head>
<body>
    <h3>----position----</h3>
    <!-- position 在英文中表示“位置”的意思它主要是用于实现对玩元素的定位,在 CSS 中定位分为三种 -->
    <!-- fixed 固定定位,relative 相对定位,absolute 绝对定位 -->
     <!-- 在使用定位属性时,一定要配合定位的坐标来使用 -->
      <!-- left/right/tip/bottom表示定位的元素离左/右/上/下边有多远 -->
    <h5>--固定定位fixed----</h5>
    <!-- 固定定位，它是相对于浏览器窗口来进行定位。不管页面如何滚动，固定定位元素显示的位置不会改变 -->
     <!-- 固定定位元素它脱离了标准文档流 -->
      <!-- 固定定位元素的的层级比标准文档流里面的元素要高所以固定定位元素它会压盖住标准文档流里面的元素 -->
       <!--  固定定位元素它不再占用空间 -->
         <!-- 固定定位元素它显示的位置不会随着浏览器滚动而滚动 -->
      <div class="d1">
        <p class="p1"></p>
        <img src="../images/图片1.jpg" alt="">
    </div>
    <br><br>
    <h5>-案例1：使用固定定位来实现返回顶部的按钮-</h5>
    <div class="d2">
        <a href="">返回<br>顶部</a>
        <img src="../images/图片1.jpg" alt="">
    </div>

    <h5>-案例2：使用固定定位来实现顶部的导航栏-</h5>
    <div class="d3">
        <div class="d4">
            <ul>
                <!-- #表示空连接 -->
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
                <li><a href="#">网站栏目</a></li>
            </ul>
        </div>
    </div>


</body>
</html>
