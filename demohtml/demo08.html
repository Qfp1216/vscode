<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo08</title>
    <link rel="stylesheet" href="../css/demo08.css">
</head>
<body>
    <h3>----position----</h3>
    <h5>--相对定位--</h5>
    <!-- 相对定位相当于“自己”来定位； -->
     <!-- 语法：position: relative;   -->
      <!-- 相对定位元素它没有脱离标准文档流 -->
       <!-- 相对定位元素没有设置定位坐标，那么相对定位元素还在原来位置 -->
        <!-- 相对定位元素设置了定位坐标，就会在原位置留下一个空白元素 -->
         <!-- 相对定位元素会将标准文档流中的元素压盖住 -->
          <!-- 相对定位元素的定位值可以为负数 -->
           <!-- 相对定位元素一般很少单独使用，主要是用来配合“绝对定位”元素来使用 -->
    <div class="d1">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
    </div>
    <h5>--相对定位案例：使用属性选择器来匹配元素--</h5>
    <input type="text"><input type="button" value="检测用户名">
    <br><br>

    <h5>-绝对定位--</h5>
    <!-- 绝对定位元素是相对于“祖先定位元素”来进行定位! -->
    <!-- 绝对定位元素它会先去查找其父元素是否设置了定位的属性，
     如果有设置定位的属性那么它就会相对于其父元素来进行定位;
     但是如果它的父元素没有设置定位属性，
     那么它就会去查找其父元素的上一级元素是否设置了定位的属性,
     如果有设置就相对于其父元素的上一级元素进行定位，
     但是如果没有设置，那么会继续往向一级进行查找，
     如果其祖先元素都没有设置定位属性，
     那么它会相对于“浏览器窗口”来进行定位! -->
     <!-- 绝对定位元素它脱离了标准文档流。 -->
      <!-- 绝对定位元素它不再占用空间 -->
       <!-- 绝对定位元素它会压盖住标准文档流中的元素。 -->
    <div class="d2">
        <div class="div1"></div>
        <div class="div2"></div>
        <div class="div3"></div>
    </div>
    <!-- 如果当前元素的父元素与其爷爷元素都设置了相对定位
     当前的绝对定位元素它会相对于其父元素来进行定位，
     也就是说当绝对定位元素查找到了其祖先元素已经设置了定位的属性就不会查找上一级元素 -->

    <h5>--使用绝对定位来实现拉手往上的效果--</h5>
</body>
</html>
