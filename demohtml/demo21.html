<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件代理/事件委托</title>
</head>
<body>
    
    <!-- 点击所有li标签生效 -->
    <ul id="list">
        <li>列表1</li>
        <li>列表2</li>
        <p>哈哈哈</p>
    </ul>

    <script>
        var list = document.getElementById("list");
        // 点击子元素可以触发父元素事件
        // list.onclick = function(e){
        //     console.log("点击了列表");
        // }

        list.addEventListener("click",function(e){
            // console.log(e.target.tagName);//打印标签类型
            // tagName返回标签是大写，可以使用tolowerCase()方法转换成小写,
            // 不转就是LI
            if(event.target.tagName.toLowerCase() === "li"){
                // console.log("点击了li标签");
                console.log(e.target.innerHTML);//打印了标签内容
            }
        })
    </script>

</body>
</html>
