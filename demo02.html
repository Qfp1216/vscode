<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo02</title>
    <style>
        /* 嵌入式css方式
        选择器{属性：值;属性：值}
        */
        /* style标签可以出现在任何地方，但是一般放置在title后 */
        div{
            width: 100px;
            height: 100px;
            background-color: pink;
        }
    </style>
</head>
<body>
    <div>
        aa
    </div>

    <!-- css行内式 -->
     <div style="width: 100px; height: 100px; background-color: red;">
        bb
     </div>
</body>
</html>
